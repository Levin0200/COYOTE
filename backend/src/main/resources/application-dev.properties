spring.datasource.url=jdbc:h2:file:./data/moyeon;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dev-only JWT key (HS256 needs at least 32 bytes). Never reuse in production.
app.jwt.secret=dev-only-secret-key-change-me-0123456789abcdef
app.jwt.expiration-minutes=120

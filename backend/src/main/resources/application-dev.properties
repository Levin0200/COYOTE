spring.datasource.url=jdbc:h2:file:./data/moyeon;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT_SECRET is optional in dev: without it a random key is generated at startup (tokens reset on restart).
app.jwt.expiration-minutes=120

# Local MariaDB profile for coyote_db_backend_mj
# Activate with: --spring.profiles.active=mariadb
# Credentials and signing key must be provided through environment variables.

spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/coyote_db_backend_mj}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Validate the schema created by coyote_backend_mj_schema.sql; do not alter it automatically.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=120
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 시간은 항상 UTC 기준으로 저장한다. 설정하지 않으면 서버와 DB의 시간대 차이만큼(한국 기준 9시간) 저장 값이 어긋난다.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

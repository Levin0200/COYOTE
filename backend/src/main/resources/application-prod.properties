spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=120
app.auth.cookie-name=${AUTH_COOKIE_NAME:__Host-moyeon_auth}
app.auth.cookie-secure=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# 리버스 프록시(Nginx, 로드밸런서) 뒤에서 실행하면 NATIVE 로 바꿔야 요청 제한이 실제 클라이언트 IP 기준으로 동작한다.
# 프록시가 X-Forwarded-For 를 덮어쓰는 경우에만 쓴다(그렇지 않으면 IP를 속일 수 있다).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# 시간은 항상 UTC 기준으로 저장한다. 설정하지 않으면 서버와 DB의 시간대 차이만큼(한국 기준 9시간) 저장 값이 어긋난다.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

spring.application.name=moyeon
spring.profiles.default=dev

app.cors.allowed-origins=http://localhost:5173
app.jwt.secret=${JWT_SECRET:}

# 모임당 최대 참여 인원(호스트 포함)
app.meeting.max-participants=100

# 장소 검색: 공공데이터포털 소상공인 상가(상권)정보 API. 인증키는 환경변수로만 받는다(비어 있으면 장소 검색만 비활성).
app.place.provider=public-data
app.place.data-go-kr.service-key=${DATA_GO_KR_SERVICE_KEY:}

# AI(OpenRouter): 장소 후보 선정. 키는 환경변수로만 받는다(비어 있으면 AI 없이 규칙 기반으로만 동작). provider: openrouter | fake | none
app.ai.provider=openrouter
app.ai.api-key=${OPENROUTER_API_KEY:}
app.ai.model=${OPENROUTER_MODEL:deepseek/deepseek-v4.1-flash}

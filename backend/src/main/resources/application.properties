spring.application.name=moyeon
spring.profiles.default=mariadb
# IntelliJ 실행 구성과 무관하게 프로젝트 루트의 로컬 비밀 설정을 선택적으로 읽는다.
# 두 파일은 Git과 실행 JAR에서 제외되며, 키가 없는 팀원도 서버는 정상 기동한다.
spring.config.import=optional:file:.env[.properties],optional:file:.env.place[.properties]

app.cors.allowed-origins=http://localhost:5173
app.jwt.secret=${JWT_SECRET:}
app.auth.cookie-name=moyeon_auth
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# 모임당 최대 참여 인원(호스트 포함)
app.meeting.max-participants=100

# 장소 검색: 공공데이터포털 소상공인 상가(상권)정보 API. 인증키는 환경변수로만 받는다(비어 있으면 장소 검색만 비활성).
app.place.provider=public-data
app.place.data-go-kr.service-key=${DATA_GO_KR_SERVICE_KEY:}
# 행안부 음식점·휴게음식점 API를 실시간 조회해 폐업 후보를 제외한다. 결과는 메모리가 아닌 짧은 TTL 캐시에만 둔다.
app.place.mois.enabled=${MOIS_PLACE_STATUS_ENABLED:true}
app.place.mois.service-key=${MOIS_DATA_GO_KR_SERVICE_KEY:${DATA_GO_KR_SERVICE_KEY:}}
app.place.mois.base-url=https://apis.data.go.kr/1741000
app.place.mois.connect-timeout-millis=2500
app.place.mois.read-timeout-millis=7000
app.place.mois.parallelism=8
app.place.mois.cache-ttl-millis=60000
# AI(OpenRouter): 장소 후보 선정. 키는 환경변수로만 받는다(비어 있으면 AI 없이 규칙 기반으로만 동작). provider: openrouter | fake | none
app.ai.provider=openrouter
app.ai.api-key=${OPENROUTER_API_KEY:}
app.ai.model=${OPENROUTER_MODEL:deepseek/deepseek-v4-flash-0731}
app.ai.reasoning-effort=${OPENROUTER_REASONING_EFFORT:none}
app.ai.max-output-tokens=${OPENROUTER_MAX_OUTPUT_TOKENS:512}

# async=false면 후보 만들기를 마감 요청 안에서 바로 실행한다(테스트용).
app.place-decision.async=true

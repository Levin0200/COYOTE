spring.datasource.url=jdbc:h2:mem:moyeon-test;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.expiration-minutes=5

# 스케줄러는 테스트에서 직접 호출한다.
app.scheduling.enabled=false

# 기존 테스트가 같은 이메일·IP로 요청을 많이 보내므로 발송·IP 제한은 크게 풀어 둔다.
# 제한 동작은 RateLimit*Test 에서 값을 따로 지정해 검증한다. (로그인 실패 제한은 기본값 그대로 쓴다.)
app.rate-limit.email-send.cooldown-seconds=0
app.rate-limit.email-send.hourly-max=100000
app.rate-limit.email-send.ip-hourly-max=100000
app.rate-limit.ip.auth-per-minute=100000
app.rate-limit.ip.invite-per-minute=100000

# 장소 검색은 외부 API 대신 고정 데이터를 쓰고, 호출 제한은 크게 풀어 둔다(제한 동작은 PlaceSearchRateLimitTest에서 검증).
app.place.provider=fake
app.rate-limit.place-search.max=100000

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="955" viewBox="0 0 1000 955" fill="none" role="img" aria-labelledby="title desc">
<title id="title">COYOTE 장소 조율 흐름</title><desc id="desc">장소를 미리 정하지 않은 모임의 장소 의견 집계에서 단독 1위는 즉시 확정한다. 동률 또는 분산된 의견은 1 km 군집과 합의 중심을 분석하고 실제 후보 검색 및 영업 검증 후 Top 3 후보 중 호스트가 선택한다. AI 사용 불가 또는 실패 시 규칙 기반 랭킹으로 대체하며 후보가 없으면 호스트가 직접 검색한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#517292"/></marker></defs>
<rect x="1" y="1" width="998" height="953" rx="20" fill="#FFFFFF" stroke="#D8E5F3" stroke-width="2"/>
<g font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="61" text-anchor="start" font-size="32" font-weight="700" fill="#163B69">장소 조율 흐름</text><text x="40" y="100" text-anchor="start" font-size="24" font-weight="500" fill="#355675">장소를 미리 정하지 않은 모임에서 참여자의 의견을 조율합니다.</text><rect x="320" y="145" width="360" height="100" rx="18" fill="#EEF5FF" stroke="#93B5E3" stroke-width="2"/><text x="500.0" y="193" text-anchor="middle" font-size="28" font-weight="700" fill="#123C6A">장소 의견 집계</text><path d="M500 245V285" stroke="#517292" stroke-width="3" fill="none"/><circle cx="500" cy="285" r="5" fill="#517292"/><path d="M500 285H210V355" fill="none" stroke="#517292" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M500 285H745V355" fill="none" stroke="#517292" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="290" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="#234767">단독 1위</text><text x="600" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="#234767">동률 · 분산된 의견</text><rect x="40" y="355" width="340" height="120" rx="18" fill="#EDF8F3" stroke="#85BBA4" stroke-width="2"/><text x="210.0" y="403" text-anchor="middle" font-size="28" font-weight="700" fill="#1C5741">장소 즉시 확정</text><text x="210.0" y="442" text-anchor="middle" font-size="24" font-weight="500" fill="#234767">투표 결과 반영</text><rect x="530" y="355" width="430" height="120" rx="18" fill="#EEF5FF" stroke="#93B5E3" stroke-width="2"/><text x="745.0" y="403" text-anchor="middle" font-size="28" font-weight="700" fill="#123C6A">1 km 군집 · 합의 중심</text><text x="745.0" y="442" text-anchor="middle" font-size="24" font-weight="500" fill="#234767">가까운 장소 의견을 묶어 분석</text><path d="M745 475V565" fill="none" stroke="#517292" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="530" y="565" width="430" height="130" rx="18" fill="#FFF4EB" stroke="#E9B184" stroke-width="2"/><text x="745.0" y="608" text-anchor="middle" font-size="28" font-weight="700" fill="#123C6A">실제 후보 검색 · 영업 검증</text><text x="745.0" y="647" text-anchor="middle" font-size="24" font-weight="500" fill="#234767">공공데이터 기반 장소 검색</text><text x="745.0" y="681" text-anchor="middle" font-size="24" font-weight="500" fill="#234767">음식점 · 카페 상태 확인</text><path d="M745 695V785" fill="none" stroke="#517292" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="530" y="785" width="430" height="130" rx="18" fill="#F7EFFF" stroke="#C89EE4" stroke-width="2"/><text x="745.0" y="828" text-anchor="middle" font-size="28" font-weight="700" fill="#123C6A">AI 추천 · Top 3 후보</text><text x="745.0" y="867" text-anchor="middle" font-size="24" font-weight="500" fill="#234767">모임 제목·설명을 반영</text><text x="745.0" y="901" text-anchor="middle" font-size="24" font-weight="500" fill="#234767">호스트가 최종 장소 선택</text><rect x="40" y="660" width="410" height="210" rx="18" fill="#F8FAFD" stroke="#ABC0D8" stroke-width="2" stroke-dasharray="8 7"/><text x="65" y="706" text-anchor="start" font-size="26" font-weight="700" fill="#163B69">예외 처리</text><text x="65" y="750" text-anchor="start" font-size="24" font-weight="600" fill="#234767">AI 사용 불가·실패</text><text x="65" y="784" text-anchor="start" font-size="24" font-weight="500" fill="#234767">→ 규칙 기반 랭킹</text><text x="65" y="828" text-anchor="start" font-size="24" font-weight="500" fill="#234767">후보 없음 → 호스트 직접 검색</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2800" viewBox="0 0 1000 2800" fill="none" role="img" aria-labelledby="title desc">
<title id="title">COYOTE 서비스 구성과 실제 배포 아키텍처</title>
<desc id="desc">상단은 코드 기준 서비스 구성이다. 사용자, React와 Vite, Spring Boot, MariaDB, Kakao Maps, SMTP와 공공데이터, OpenRouter 및 DeepSeek를 연결한다. 하단은 운영 배포 구성이다. Cloudflare Workers Static Assets가 dist 정적 자산을 제공하며 API 요청은 Worker가 X-Coyote-Origin 헤더를 붙여 HTTPS로 EC2의 Caddy에 전달한다. 단일 EC2의 Docker Compose에서 Caddy, Spring Boot, MariaDB 세 컨테이너를 운영한다. Caddy는 80과 443 포트를 받고 Origin 토큰을 검사한 후 backend:8080으로 전달한다. Spring Boot는 내부 mariadb:3306에 접근한다. 백엔드 호스트 바인딩은 127.0.0.1:8080이고 DB 호스트 포트는 공개하지 않는다. Caddy와 MariaDB의 세 named volume은 같은 EC2의 단일 루트 EBS에 저장한다.</desc>

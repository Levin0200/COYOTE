<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1704" viewBox="0 0 1000 1704" role="img" aria-labelledby="title description">
<title id="title">모여ON ERD 관계 흐름도</title><desc id="description">원본 PNG와 SQL 스키마를 대조한 10개 테이블과 10개 외래키 관계. 일반 컬럼을 생략하고 PK와 FK를 표시합니다. 화살표는 참조 대상인 부모에서 FK를 가진 자식으로 향합니다. 단독 UNIQUE인 FK는 부모 1건당 자식 0..1건, 나머지 FK는 0..N건입니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#376FA4"/></marker></defs>
<rect width="1000" height="1704" fill="#FFFFFF"/>

ight="181" rx="12" fill="#FFFFFF" stroke="#C5D3E2"/><rect x="30" y="770" width="300" height="48" rx="12" fill="#EAF2FD" stroke="#C5D3E2"/><rect x="31" y="800" width="298" height="18" fill="#EAF2FD"/><text x="44" y="801" font-size="22" font-weight="600" fill="#143D6B" text-anchor="start">participant</text><text x="44" y="849" font-size="22" font-weight="400" fill="#203751" text-anchor="start">id</text><text x="316" y="849" font-size="20" font-weight="600" fill="#1F66A7" text-anchor="end">PK</text><text x="44" y="883" font-size="22" font-weight="400" fill="#203751" text-anchor="start">meeting_id</text><text x="316" y="883" font-size="20" font-weight="600" fill="#1F66A7" text-anchor="end">FK</text><text x="44" y="917" font-size="22" font-weight="400" fill="#203751" text-anchor="start">user_id</text><text x="316" y="917" font-size="20" font-weight="600" fill="#1F66A7" text-anchor="end">FK · NULL</text><rect x="350" y="770" width="300" height="181" rx="12" fill="#FFFFFF" stroke="#C5D3E2"/><rect x="350" y="770" width="300" height="48" rx="12" fill="#EAF2FD" stroke="#C5D3E2"/><rect x="351" y="800" width="298" height="18" fill="#EAF2FD"/><text x="364" y="801" font-size="22" font-weight="600" fill="#143D6B" text-anchor="start">meeting_response</text><text x="364" y="849" font-size="22" font-weight="400" fill="#203751" text-anchor="start">id</text><text x="636" y="849" font-size="20" font-weight="600" fill="#1F66A7" text-anchor="end">PK</text><text x="364" y="883" font-size="22" font-weight="400" fill="#203751" text-anchor="start">meeting_id</text><text x="636" y="883" font-size="20" font-weight="600" fill="#1F66A7" text-anchor="end">FK</text><text x="364" y="917" font-size="22" font-weight="400" fill="#203751" text-anchor="start">participant_id</text><text x="636" y="917" font-size="20" font-weight="600" fill="#1F66A7" text-anchor="end">FK/UQ</text><rect x="670" y="770" width="300" height="147" rx="12" fill="#FFFFFF" stroke="#C5D3E2"/><rect x="670" y="770" width="300" height="48" rx="12" fill="#EAF2FD" stroke="#C5D3E2"/><rect x="671" y="800" width="298" height="18" fill="#EAF2FD"/><text x="684" y="801" font-size="20" font-weight="600" fill="#143D6B" text-anchor="start">response_available_date</text><text x="684" y="849" font-size="22" font-weight="400" fill="#203751" text-anchor="start">response_id</text><text x="956" y="849" font-size="20" font-weight="600" fill="#1F66A7" text-anchor="end">PK/FK</text><text x="684" y="883" font-size="22" font-weight="400" fill="#203751" text-anchor="start">available_date</text><text x="956" y="883" font-size="20" font-weight="600" fill="#1F66A7" text-anchor="end">PK</text><rect x="350" y="1090" width="300" height="147" rx="12" fill="#FFFFFF" stroke="#C5D3E2"/><rect x="350" y="1090" width="300" height="48" rx="12" fill="#EAF2FD" stroke="#C5D3E2"/><rect x="351" y="1120" width="298" height="18" fill="#EAF2FD"/><text x="364" y="1121" font-size="22" font-weight="600" fill="#143D6B" text-anchor="start">final_result</text><text x="364" y="1169" font-size="22" font-weight="400" fill="#203751" text-anchor="start">id</text><text x="636" y="1169" font-size="20" font-weight="600" fill="#1F66A7" text-anchor="end">PK</text><text x="364" y="1203" font-size="22" font-weight="400" fill="#203751" text-anchor="start">meeting_id</text><text x="636" y="1203" font-size="20" font-weight="600" fill="#1F66A7" text-anchor="end">FK/UQ</text><rect x="30" y="1400" width="300" height="147" rx="12" fill="#FFFFFF" stroke="#C5D3E2"/><rect x="30" y="1400" width="300" height="48" rx="12" fill="#EAF2FD" stroke="#C5D3E2"/><rect x="31" y="1430" width="298" height="18" fill="#EAF2FD"/><text x="44" y="1431" font-size="22" font-weight="600" fill="#143D6B" text-anchor="start">final_result_place</text><text x="44" y="1479" font-size="22" font-weight="400" fill="#203751" text-anchor="start">final_result_id</text><text x="316" y="1479" font-size="20" font-weight="600" fill="#1F66A7" text-anchor="end">PK/FK</text><text x="44" y="1513" font-size="22" font-weight="400" fill="#203751" text-anchor="start">sort_order</text><text x="316" y="1513" font-size="20" font-weight="600" fill="#1F66A7" text-anchor="end">PK</text><rect x="670" y="1400" width="300" height="147" rx="12" fill="#FFFFFF" stroke="#C5D3E2"/><rect x="670" y="1400" width="300" height="48" rx="12" fill="#EAF2FD" stroke="#C5D3E2"/><rect x="671" y="1430" width="298" height="18" fill="#EAF2FD"/><text x="684" y="1431" font-size="20" font-weight="600" fill="#143D6B" text-anchor="start">final_result_candidate</text><text x="684" y="1479" font-size="22" font-weight="400" fill="#203751" text-anchor="start">final_result_id</text><text x="956" y="1479" font-size="20" font-weight="600" fill="#1F66A7" text-anchor="end">PK/FK</text><text x="684" y="1513" font-size="22" font-weight="400" fill="#203751" text-anchor="start">sort_order</text><text x="956" y="1513" font-size="20" font-weight="600" fill="#1F66A7" text-anchor="end">PK</text><text x="30" y="1600" font-size="20" font-weight="400" fill="#4F657A" text-anchor="start">이 도식의 FK/UQ는 단일 컬럼 고유키입니다: 부모 1건당 자식 0..1건.</text><text x="30" y="1634" font-size="20" font-weight="400" fill="#4F657A" text-anchor="start">나머지 FK는 부모 1건당 자식 0..N건입니다. NULL은 자식의 부모 참조가 선택 사항임을 뜻합니다.</text><text x="30" y="1668" font-size="20" font-weight="400" fill="#4F657A" text-anchor="start">여러 컬럼에 PK가 표시된 테이블은 해당 컬럼을 묶은 복합 기본키입니다.</text></g></svg>
